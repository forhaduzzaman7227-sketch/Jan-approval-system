<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2)}
.box{width:90%;max-width:390px;background:#fff;padding:30px;border-radius:25px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.3)}
.profile{width:125px;height:125px;margin:0 auto 18px;border-radius:50%;overflow:hidden;border:5px solid white;box-shadow:0 5px 20px rgba(0,0,0,.25)}
.profile img{width:100%;height:100%;object-fit:cover;display:block}
.homepic{width:175px;height:175px;margin:0 auto 18px;border-radius:22px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.22)}
.homepic img{width:100%;height:100%;object-fit:cover;display:block}
h1{color:#333;margin-bottom:8px;font-size:28px}
.subtitle{color:#777;margin-bottom:25px}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px;outline:none;font-size:16px}
button{width:100%;padding:14px;margin-top:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-size:16px;font-weight:bold;cursor:pointer}
#waiting,#home{display:none}
.wait{font-size:26px;color:#e91e63;margin-bottom:12px}
.message{color:#666;line-height:1.7;font-size:16px}
.love{font-size:30px;font-weight:bold;color:#e91e63;margin:12px 0 16px}
.hearts{font-size:25px;margin:20px 0}
</style>

  <h1>Welcome Jan ❤️</h1>
  <div class="love">I Love You ❤️</div>
  <p class="message">Welcome to my website! 🌸<br>You have successfully logged in. 🥰</p>
  <div class="hearts">❤️ 💕 💖 💗 ❤️</div>
  <button onclick="logout()">Logout</button>
</div>

<script>
function loginRequest(){
  const phone=document.getElementById("phone").value.trim();
  const password=document.getElementById("password").value;
  if(!phone || !password){ alert("Please enter your phone number and password."); return; }
  document.getElementById("login").style.display="none";
  document.getElementById("waiting").style.display="block";
  document.getElementById("status").textContent="Demo preview: an approval email would be sent to the admin.";
}
async function poll(id){
  const timer=setInterval(async()=>{
    try{
      const r=await fetch("/api/login-status/"+encodeURIComponent(id));
      if(!r.ok) return;
      const d=await r.json();
      if(d.status==="approved"){
        clearInterval(timer);
        document.getElementById("waiting").style.display="none";
        document.getElementById("home").style.display="block";
      }
      if(d.status==="rejected"){
        clearInterval(timer);
        alert("Your login request was rejected.");
        logout();
      }
    }catch(e){}
  },3000);
}

function logout(){
  document.getElementById("home").style.display="none";
  document.getElementById("waiting").style.display="none";
  document.getElementById("login").style.display="block";
  document.getElementById("phone").value="";
  document.getElementById("password").value="";
}
</script>
